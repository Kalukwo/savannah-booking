name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same variable names the app reads locally from .env.
      # Override with a repo secret to test against a hosted DB; the
      # fallback is the throwaway service container above.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+asyncpg://postgres:postgres@localhost:5432/appointments_test' }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql+asyncpg://postgres:postgres@localhost:5432/appointments_test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q

  deploy:
    # Render builds from the repo itself, so there is no image to push and
    # no registry involved. Set DATABASE_URL (Neon) in the Render dashboard.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DEPLOY_HOOK_URL is the Render Deploy Hook for the web service.
      # Create it in Render: Service Settings -> Deploy Hook.
      # If the secret is unset the job is a no-op rather than a failure.
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
